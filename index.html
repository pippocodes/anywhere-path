<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anywhere Path</title>
    <!-- Must come before the inline script below, which looks it up synchronously. -->
    <meta name="theme-color" content="#210100" />
    <!--
      Sets data-theme/data-mode on <html> synchronously, before first paint,
      so there's no flash of the wrong theme. Keep the theme keys, storage
      keys, and default here in sync with src/context/ThemeContext.tsx —
      this script can't import that module, it has to run standalone.
    -->
    <script>
      (function () {
        // Keep in sync with src/context/ThemeContext.tsx's DEFAULT_THEME /
        // DEFAULT_MODE and src/theme-tokens.json's bg colors — this script
        // can't import either module, it has to run standalone.
        var THEME_BG = {
          plum: { dark: '#0e0912', light: '#fbf5ef' },
          carousel: { dark: '#210100', light: '#fff8ea' },
          burgundy: { dark: '#2a1018', light: '#fbf5ea' },
          strawberry: { dark: '#1e0d0a', light: '#fdf1ee' },
        }
        try {
          var theme = localStorage.getItem('anywherePathTheme')
          if (!THEME_BG[theme]) theme = 'carousel'
          var mode = localStorage.getItem('anywherePathColorMode')
          if (mode !== 'light' && mode !== 'dark' && mode !== 'system') mode = 'system'
          var resolved = mode === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.setAttribute('data-mode', resolved)
          document.querySelector('meta[name="theme-color"]').setAttribute('content', THEME_BG[theme][resolved])
        } catch (e) {
          var fallbackMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', 'carousel')
          document.documentElement.setAttribute('data-mode', fallbackMode)
          document.querySelector('meta[name="theme-color"]').setAttribute('content', THEME_BG.carousel[fallbackMode])
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
